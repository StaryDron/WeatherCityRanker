version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: weatherapp_db_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - eventweather_network

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: weatherapp_ingestion_dev
    env_file: .env
    environment:
      APP_ENV: dev
      INGESTION_INTERVAL_HOURS: 1
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - eventweather_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: weatherapp_backend_dev
    env_file: .env
    environment:
      APP_ENV: dev
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - eventweather_network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: nginx:alpine
    container_name: weatherapp_frontend_dev
    ports:
      - "8090:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - eventweather_network

networks:
  eventweather_network:
    driver: bridge
