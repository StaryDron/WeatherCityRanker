version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: weatherapp_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - eventweather_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  ingestion:
    build: ./ingestion
    container_name: weatherapp_ingestion
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eventweather_network

  backend:
    build: ./backend
    container_name: weatherapp_backend
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eventweather_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    image: nginx:alpine
    container_name: weatherapp_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - eventweather_network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  eventweather_network:
    driver: bridge
