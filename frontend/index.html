<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventWeather PL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <style>
        body { background-color: #0f1117; color: #e0e0e0; }
        .navbar { background-color: #1a1d2e !important; border-bottom: 1px solid #2d3150; }
        .navbar-brand { color: #7c83fd !important; font-weight: 700; font-size: 1.4rem; }
        .card { background-color: #1a1d2e; border: 1px solid #2d3150; color: #e0e0e0; }
        .card:hover { border-color: #7c83fd; transform: translateY(-2px); transition: all 0.2s; }
        .score-badge { font-size: 1.1rem; font-weight: 700; }
        .score-high { color: #4caf50; }
        .score-mid { color: #ff9800; }
        .score-low { color: #f44336; }
        .weather-icon { font-size: 2rem; }
        .section-title { color: #7c83fd; font-weight: 600; border-bottom: 1px solid #2d3150; padding-bottom: 0.5rem; }
        .filter-bar { background-color: #1a1d2e; border: 1px solid #2d3150; border-radius: 8px; padding: 1rem; }
        select, .form-check-input { background-color: #0f1117; color: #e0e0e0; border-color: #2d3150; }
        select option { background-color: #1a1d2e; }
        #map { height: 400px; border-radius: 8px; border: 1px solid #2d3150; }
        .ranking-bar { background-color: #7c83fd; height: 8px; border-radius: 4px; }
        .recurring-badge { background-color: #2d3150; color: #7c83fd; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; }
        .best-day { color: #4caf50; font-size: 0.8rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand">⛅ EventWeather PL</span>
        <div class="d-flex align-items-center gap-3">
            <select id="citySelect" class="form-select form-select-sm" style="width:160px">
                <option value="">Wszystkie miasta</option>
            </select>
            <select id="categorySelect" class="form-select form-select-sm" style="width:160px">
                <option value="">Wszystkie kategorie</option>
                <option value="Music">Muzyka</option>
                <option value="Sports">Sport</option>
                <option value="Arts & Theatre">Teatr i sztuka</option>
                <option value="Miscellaneous">Inne</option>
            </select>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="goodWeatherOnly">
                <label class="form-check-label text-light" for="goodWeatherOnly">Tylko dobra pogoda</label>
            </div>
        </div>
    </div>
</nav>

<div class="container">

    <!-- RANKING -->
    <h5 class="section-title mb-3">🏆 Ranking miast</h5>
    <div id="ranking" class="row mb-4"></div>

    <!-- MAPA -->
    <h5 class="section-title mb-3">🗺️ Mapa wydarzeń</h5>
    <div id="map" class="mb-4"></div>

    <!-- WYDARZENIA -->
    <h5 class="section-title mb-3">🎭 Wydarzenia</h5>
    <div id="events" class="row"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "http://localhost:8000";

// ikony pogody
function weatherIcon(main) {
    const icons = {
        "Clear": "☀️", "Clouds": "☁️", "Rain": "🌧️",
        "Drizzle": "🌦️", "Thunderstorm": "⛈️", "Snow": "❄️",
        "Mist": "🌫️", "Fog": "🌫️"
    };
    return icons[main] || "🌡️";
}

// kolor score
function scoreClass(score) {
    if (score >= 75) return "score-high";
    if (score >= 50) return "score-mid";
    return "score-low";
}

// inicjalizacja mapy Leaflet
const map = L.map("map").setView([52.0, 19.5], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
}).addTo(map);
let markers = [];

function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
}

function addMarker(event) {
    if (!event.lat || !event.lon) return;
    const marker = L.marker([event.lat, event.lon])
        .addTo(map)
        .bindPopup(`
            <b>${event.name}</b><br>
            ${event.local_date} ${event.local_time || ""}<br>
            ${weatherIcon(event.weather_main)} ${event.temp}°C<br>
            Score: ${event.weather_score}/100
        `);
    markers.push(marker);
}

// ladowanie miast do dropdowna
async function loadCities() {
    const res = await fetch(`${API}/api/cities`);
    const data = await res.json();
    const select = document.getElementById("citySelect");
    data.cities.forEach(city => {
        const opt = document.createElement("option");
        opt.value = city.id;
        opt.textContent = city.name;
        select.appendChild(opt);
    });
}

// ladowanie rankingu
async function loadRanking() {
    const res = await fetch(`${API}/api/cities/ranking`);
    const data = await res.json();
    const max = data.ranking[0]?.event_count || 1;
    const html = data.ranking.map(city => `
        <div class="col-md-3 col-6 mb-3">
            <div class="card p-3">
                <div class="fw-bold">${city.name}</div>
                <div class="text-muted small">${city.event_count} wydarzeń</div>
                <div class="ranking-bar mt-2" style="width:${(city.event_count/max*100)}%"></div>
                <div class="small mt-1 ${scoreClass(city.avg_weather_score)}">
                    Śr. score: ${city.avg_weather_score}
                </div>
            </div>
        </div>
    `).join("");
    document.getElementById("ranking").innerHTML = html;
}

// ladowanie wydarzen
async function loadEvents() {
    const cityId = document.getElementById("citySelect").value;
    const category = document.getElementById("categorySelect").value;
    const goodOnly = document.getElementById("goodWeatherOnly").checked;

    let url = `${API}/api/events?`;
    if (cityId) url += `city_id=${cityId}&`;
    if (category) url += `category=${encodeURIComponent(category)}&`;

    const res = await fetch(url);
    const data = await res.json();

    let events = data.events;
    if (goodOnly) events = events.filter(e => e.weather_score >= 75);

    clearMarkers();
    events.forEach(addMarker);

    const html = events.length === 0
        ? `<div class="col-12 text-center text-muted py-5">Brak wydarzeń dla wybranych filtrów</div>`
        : events.map(e => `
        <div class="col-md-4 mb-3">
            <div class="card p-3 h-100">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="weather-icon">${weatherIcon(e.weather_main)}</span>
                    <span class="score-badge ${scoreClass(e.weather_score)}">${e.weather_score}/100</span>
                </div>
                <h6 class="fw-bold mb-1">${e.name}</h6>
                ${e.is_recurring ? `<span class="recurring-badge mb-1">🔁 Wydarzenie cykliczne</span>` : ""}
                <div class="small text-muted mb-1">📅 ${e.local_date} ${e.local_time ? "o " + e.local_time.slice(0,5) : ""}</div>
                <div class="small text-muted mb-1">📍 ${e.venue_name || "Brak danych"}</div>
                <div class="small text-muted mb-2">🎭 ${e.category}</div>
                <div class="small mb-2">
                    ${weatherIcon(e.weather_main)} ${e.weather_main} · 🌡️ ${e.temp}°C · 💨 ${e.wind_speed} m/s · 💧 ${e.humidity}%
                </div>
                ${e.url ? `<a href="${e.url}" target="_blank" class="btn btn-sm btn-outline-light mt-auto">Kup bilet →</a>` : ""}
            </div>
        </div>
    `).join("");

    document.getElementById("events").innerHTML = html;
}

// eventy na filtry
document.getElementById("citySelect").addEventListener("change", loadEvents);
document.getElementById("categorySelect").addEventListener("change", loadEvents);
document.getElementById("goodWeatherOnly").addEventListener("change", loadEvents);

// start
loadCities();
loadRanking();
loadEvents();
</script>
</body>
</html>
